services:
  monitor-server:
    build:
      context: ..              
      dockerfile: docker/Dockerfile  
    container_name: monitor-server
    ports:
      - "9999:9999"
      - "514:514/udp"

  device-router-core:
    build:
      context: .
      dockerfile: Dockerfile.alpine-syslog
    depends_on:
      - monitor-server

  agent-01:
    build:
      context: ..             
      dockerfile: docker/Dockerfile  
    depends_on:
      - monitor-server
    command: ["./build/tcp_client", "monitor-server"]
    stdin_open: true
    tty: true

  device-nginx-real:
    image: nginx:alpine
    container_name: device-nginx-real
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro 
    depends_on:
      - monitor-server
    ports:
      - "8080:80" 

  device-haproxy-lb:
    image: haproxy:alpine
    container_name: device-haproxy-lb
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - monitor-server

  device-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: device-scheduler
    depends_on:
      - monitor-server