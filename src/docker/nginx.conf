worker_processes 1;

events { worker_connections 1024; }

http {
    access_log syslog:server=monitor-server:514,tag=nginx_real,severity=info combined;
    error_log  syslog:server=monitor-server:514,tag=nginx_real,severity=error;

    server {
        listen 80;

        location / {
            return 200 'Hello! I am a REAL Nginx server sending native logs!\n';
        }

        location /forbidden {
            return 403 'This is a real 403 Forbidden error.\n';
        }
    }
}